# Zerobeat nginx site. install.sh fills in the two placeholders:
#   --tunnel  listens on loopback only, for Cloudflare Tunnel or another HTTPS proxy in front
#   --lan     listens on port 80 everywhere, plain HTTP on the local network
# The web app is on 127.0.0.1:3000, the engine's WebSocket on 127.0.0.1:3101.
# Extra server blocks of your own (a redirect from an old name, say) belong in
# /etc/nginx/conf.d/, which a re-install leaves alone.

limit_req_zone $binary_remote_addr zone=ds_auth:10m rate=20r/m;

# Behind a tunnel, the proxy on this machine connects over loopback and names the
# client in a header (CF-Connecting-IP for cloudflared; install.sh --client-ip-header
# for another proxy). On the LAN nothing is trusted: the address is the connection's.
# A header no proxy here sets would let anyone choose the address the login limits see.
@REALIP@

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
@LISTEN@
    server_name _;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header CF-Connecting-IP  $remote_addr;
    # https behind a tunnel (the session cookie is then Secure), $scheme on the LAN
    proxy_set_header X-Forwarded-Proto @PROTO@;
    proxy_set_header X-Forwarded-Host  $host;

    location /ws {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/auth/ {
        limit_req zone=ds_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/adif {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
