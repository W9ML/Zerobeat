# Drop-in for a radio on this machine (ICOM on USB, or Hamlib): the engine needs the
# radio's serial port and sound card, and runs rigctld for Hamlib radios. Everything else
# under /dev stays hidden. Installed by deploy/enable-local-radio.sh.
[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-ttyACM rw
DeviceAllow=char-ttyUSB rw
DeviceAllow=char-ttyS rw
DeviceAllow=char-alsa rw
SupplementaryGroups=dialout audio
